# api.nayaverse.studio -> the Studio API container on this box.
#
# Installed by deploy/server/bootstrap.sh into /etc/nginx/sites-available and
# given HTTPS by certbot, which edits this file to add the certificate and
# the redirect from port 80.

server {
    listen 80;
    listen [::]:80;
    server_name api.nayaverse.studio;

    # Footage uploads are capped at 200MB by the API itself; a little over
    # that here, so the API -- not nginx -- gives the error a person reads.
    client_max_body_size 210m;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI writing thinks before it answers; a script can take a minute.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        # Uploads stream straight through rather than filling nginx's disk.
        proxy_request_buffering off;
    }
}
